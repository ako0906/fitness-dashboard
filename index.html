<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0E16" />
  <title>ako Fitness</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fitness" />
  <link rel="apple-touch-icon" href="icon-180.png" />

  <!-- Pretendard for everything Korean+body, Geist Mono only for tiny meta -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist-font@1.3.0/dist/mono/style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ptr" id="ptr" aria-hidden="true">
    <svg class="ptr-ring" viewBox="0 0 32 32" width="32" height="32">
      <circle class="ptr-track" cx="16" cy="16" r="12" fill="none" stroke-width="2.2" />
      <circle class="ptr-arc" id="ptrArc" cx="16" cy="16" r="12" fill="none"
              stroke-width="2.2" stroke-linecap="round"
              stroke-dasharray="75.4" stroke-dashoffset="75.4"
              transform="rotate(-90 16 16)" />
    </svg>
  </div>
  <main class="app">

    <!-- ───────── 1. 히어로 ───────── -->
    <header class="hero" id="hero">
      <div class="hero-section">
        <span class="hero-eyebrow">목표일까지</span>
        <span class="hero-display" id="dDay">—</span>
        <span class="hero-meta" id="targetDateLabel">—</span>
      </div>

      <div class="hero-divider"></div>

      <div class="hero-section">
        <div class="hero-eyebrow-row">
          <span class="hero-eyebrow" id="metricEyebrow">진행</span>
          <span class="guard-badge" id="guardBadge" hidden>—</span>
        </div>
        <div class="progress-row">
          <span class="progress-current" id="currentBf">—</span>
          <span class="progress-target" id="targetBfLabel">—</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-marker" id="progressMarker">
            <span class="marker-tri"></span>
          </div>
        </div>
        <div class="progress-foot">
          <span id="progressPct">—</span>
          <span class="progress-start" id="startBfLabel">—</span>
        </div>
        <div class="pace-line" id="paceLine"></div>
      </div>

      <div class="updated" id="lastUpdated">—</div>
    </header>

    <!-- ───────── 코치 노트 ───────── -->
    <aside class="coach-note" id="coachNote" hidden>
      <div class="coach-accent" aria-hidden="true"></div>
      <div class="coach-avatar" aria-hidden="true"><span class="coach-pulse"></span></div>
      <div class="coach-body">
        <div class="coach-head">
          <span class="coach-title">코치 노트</span>
          <span class="coach-date" id="coachDate">—</span>
        </div>
        <p class="coach-msg" id="coachMsg">—</p>
      </div>
      <button class="coach-close" id="coachClose" aria-label="오늘 하루 닫기">
        <svg viewBox="0 0 12 12" width="11" height="11" fill="none" aria-hidden="true">
          <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </aside>

    <!-- ───────── 칩 네비 ───────── -->
    <div class="nav-sentinel" id="navSentinel" aria-hidden="true"></div>
    <nav class="chip-nav" id="chipNav" aria-label="섹션 이동">
      <button class="chip active" data-target="top">오늘</button>
      <button class="chip" data-target="g-body">바디</button>
      <button class="chip" data-target="g-training">트레이닝</button>
      <button class="chip" data-target="g-review">리뷰</button>
    </nav>

<!-- ───────── 4. 오늘의 매크로 링 ───────── -->
    <section class="card">
      <div class="card-head">
        <h2>오늘</h2>
        <span class="card-sub" id="todayType">—</span>
      </div>
      <div class="meal-strip" id="mealStrip"></div>
      <div class="macro-grid" id="macroGrid">
        <!-- rings injected by JS -->
      </div>
    </section>

    
    <div class="group-head" id="g-body"><span>바디</span></div>
<!-- ───────── 3. 체성분 ───────── -->
    <section class="card">
      <div class="card-head">
        <h2>체성분</h2>
        <span class="card-sub">7일 변화</span>
      </div>
      <div class="metric-row">
        <div class="metric-card" id="card-weight">
          <span class="metric-label">체중</span>
          <span class="metric-num">—</span>
          <span class="metric-delta">—</span>
          <div class="sparkline-wrap"></div>
        </div>
        <div class="metric-card" id="card-skeletal">
          <span class="metric-label">골격근</span>
          <span class="metric-num">—</span>
          <span class="metric-delta">—</span>
          <div class="sparkline-wrap"></div>
        </div>
        <div class="metric-card" id="card-bf">
          <span class="metric-label">체지방률</span>
          <span class="metric-num">—</span>
          <span class="metric-delta">—</span>
          <div class="sparkline-wrap"></div>
        </div>
      </div>
      <div class="chart-sub-head">
        <span class="chart-sub-title" id="chartTitle">체지방률 추이</span>
        <span class="chart-sub-meta" id="chartMeta">—</span>
      </div>
      <div class="chart-wrap">
        <canvas id="bfChart"></canvas>
      </div>
    </section>

    
    <div class="group-head" id="g-training"><span>트레이닝</span></div>
<!-- ───────── 2. 운동 잔디 ───────── -->
    <section class="card">
      <div class="card-head">
        <h2>운동 잔디</h2>
        <span class="card-sub" id="gridSubtitle">최근 1년</span>
      </div>
      <div class="heatmap-wrap">
        <div class="heatmap-months" id="heatmapMonths"></div>
        <div class="heatmap" id="heatmap"></div>
      </div>
      <div class="legend">
        <span class="dot dot-active"></span><span class="legend-label">운동한 날</span>
        <span class="dot dot-broken"></span><span class="legend-label">못 한 날</span>
        <span class="dot dot-today"></span><span class="legend-label">오늘</span>
      </div>
    </section>

    <!-- ───────── 3.5 리프팅 (1RM) ───────── -->
    <section class="card" id="liftSection">
      <div class="card-head">
        <h2>리프팅</h2>
        <span class="card-sub" id="liftSub">—</span>
      </div>
      <div class="lift-grid" id="liftGrid"></div>
      <div class="chart-sub-head" id="liftChartHead" hidden>
        <span class="chart-sub-title" id="liftChartTitle">—</span>
        <span class="chart-sub-meta" id="liftChartMeta">추정 1RM</span>
      </div>
      <div class="chart-wrap" id="liftChartWrap" hidden>
        <canvas id="liftChart"></canvas>
      </div>
      <div class="lift-empty" id="liftEmpty" hidden>
        세트 기록이 쌓이면 부위별 1RM 추이가 표시됩니다
      </div>
    </section>

    
    <div class="group-head" id="g-review"><span>리뷰</span></div>
<!-- ───────── 5. 주간 칼로리 / 단백질 바 ───────── -->
    <section class="card">
      <div class="card-head">
        <h2>이번 주</h2>
        <span class="card-sub">최근 7일</span>
      </div>
      <div class="chart-wrap chart-wrap-sm">
        <canvas id="kcalChart"></canvas>
      </div>
      <div class="chart-wrap chart-wrap-sm">
        <canvas id="proteinChart"></canvas>
      </div>
    </section>

    <!-- ───────── 6. 마지막 음주 카운터 ───────── -->
    <section class="card card-sober">
      <div class="card-head">
        <h2>음주 없이</h2>
        <span class="card-sub">지난 30일</span>
      </div>
      <div class="sober">
        <span class="sober-num" id="soberDays">—</span>
        <span class="sober-unit">일째</span>
        <div class="streak-dots" id="soberDots"></div>
        <span class="sober-meta" id="soberMeta"></span>
      </div>
    </section>

    <!-- ───────── 7. 이번주 vs 지난주 ───────── -->
    <section class="card">
      <div class="card-head">
        <h2>주간 비교</h2>
        <span class="card-sub">이번 주 / 지난주</span>
      </div>
      <div class="ww-grid" id="wwGrid">
        <!-- injected -->
      </div>
    </section>

    <!-- ───────── 8. 인사이트 카드 ───────── -->
    <section class="card card-insight">
      <div class="card-head">
        <h2>예측</h2>
        <span class="card-sub">현재 페이스 기준</span>
      </div>
      <div class="insight-hero">
        <span class="insight-hero-label" id="forecastLabel">예측 체지방률</span>
        <span class="insight-hero-value" id="forecastBig">—</span>
        <span class="insight-hero-meta" id="forecastMeta">—</span>
      </div>
      <div class="insights" id="insights">
        <!-- injected -->
      </div>
    </section>

    <footer class="footer">
      <span id="footerPhase">© 2026 ako</span>
    </footer>
  </main>

  <!-- Tap detail modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <span id="modalDate">—</span>
        <button id="modalClose" aria-label="닫기">×</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
